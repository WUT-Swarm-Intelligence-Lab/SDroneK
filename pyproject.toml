[project]
name = "SDroneK"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "sphinx", "sphinx-rtd-theme"]

[tool.ruff]
line-length = 88
exclude = ["docs"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
